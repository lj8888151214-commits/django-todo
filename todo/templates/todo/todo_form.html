<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>할 일 수정</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 0 15px; }
        .errorlist { color: red; list-style: none; padding-left: 0; }
        .form-group { margin-bottom: 12px; }
        input[type="text"], textarea { width: 100%; box-sizing: border-box; padding: 8px; }
    </style>
</head>
<body>
    <h1>할 일 수정</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label><strong>제목:</strong></label>
            {{ form.title }}
            {% if form.title.errors %}
                <ul class="errorlist">
                    {% for error in form.title.errors %}<li>{{ error }}</li>{% endfor %}
                </ul>
            {% endif %}
        </div>
        <div class="form-group">
            <label><strong>내용:</strong></label>
            {{ form.content }}
        </div>
        <div class="form-group">
            <label>{{ form.is_completed }} 완료 여부</label>
        </div>
        <button type="submit">저장</button>
        <a href="{% url 'todo_list' %}"><button type="button">취소</button></a>
    </form>
</body>
</html>
